name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag and package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./package.json'); if(p.version!==process.argv[1]){console.error('version mismatch:',p.version,'!=',process.argv[1]);process.exit(1)}" "$version"
      - run: npm run verify
      - run: npm run build
      - run: npm pack --dry-run

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN repository secret is required for npmjs publishing" >&2
            exit 1
          fi
          umask 077
          cat > "${RUNNER_TEMP}/.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          EOF
          echo "NPM_CONFIG_USERCONFIG=${RUNNER_TEMP}/.npmrc" >> "$GITHUB_ENV"
      - name: Publish to npmjs
        run: npm publish --registry=https://registry.npmjs.org --access public --provenance
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "@limccn/tokimeki-dsh ${version}" \
            --generate-notes
